<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>BINGO — Test Client</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
  body { font-family: system-ui, sans-serif; background: #0f0f1a; color: #eee; padding: 20px; }
  h1 { color: #7dd3fc; }
  #setup input, #setup button { padding: 8px 12px; margin: 4px; font-size: 14px; }
  #board { display: grid; grid-template-columns: repeat(5, 60px); gap: 6px; margin-top: 16px; }
  .cell {
    width: 60px; height: 60px; display: flex; align-items: center; justify-content: center;
    background: #1e293b; border-radius: 8px; font-size: 18px; cursor: pointer; user-select: none;
    border: 2px solid transparent;
  }
  .cell.crossed { background: #7c3aed; text-decoration: line-through; opacity: 0.6; cursor: default; }
  #status { margin-top: 12px; font-size: 16px; }
  #chat { margin-top: 20px; max-width: 400px; }
  #chatLog { height: 150px; overflow-y: auto; background: #1e293b; padding: 8px; border-radius: 8px; font-size: 13px; }
  #chatInput { width: 260px; padding: 6px; }
  .hidden { display: none; }
</style>
</head>
<body>

<h1>🎱 BINGO Test Client</h1>

<div id="setup">
  <div>
    Backend URL:
    <input id="backendUrl" placeholder="https://your-backend.onrender.com" style="width:320px" />
  </div>
  <div>
    Your name: <input id="name" placeholder="Alice" />
    <button onclick="connect()">Connect</button>
  </div>
  <div>
    <button onclick="createRoom()">Create Room</button>
    <input id="roomCodeInput" placeholder="Room code" style="width:100px" />
    <button onclick="joinRoom()">Join Room</button>
    <button onclick="quickMatch()">Quick Match</button>
  </div>
</div>

<div id="status"></div>
<div id="board" class="hidden"></div>

<div id="chat" class="hidden">
  <div id="chatLog"></div>
  <input id="chatInput" placeholder="Say something..." onkeydown="if(event.key==='Enter') sendChat()" />
  <button onclick="sendChat()">Send</button>
</div>

<script>
let socket, currentRoomId, myBoard = null, calledNumbers = [];

function connect() {
  const url = document.getElementById('backendUrl').value.trim();
  const name = document.getElementById('name').value.trim() || 'Guest';
  if (!url) { alert('Enter your backend URL first'); return; }

  socket = io(url, { auth: { name } });

  socket.on('connect', () => setStatus('Connected as ' + name + '. Create or join a room.'));
  socket.on('connect_error', (err) => setStatus('Connection error: ' + err.message));

  socket.on('game:started', (state) => {
    currentRoomId = state.roomId;
    myBoard = state.yourBoard;
    calledNumbers = state.calledNumbers;
    document.getElementById('board').classList.remove('hidden');
    document.getElementById('chat').classList.remove('hidden');
    renderBoard();
    setStatus(`Game started in room ${currentRoomId}. Turn: ${state.currentTurn === socket.id ? 'YOUR TURN' : "opponent's turn"}`);
  });

  socket.on('game:moveMade', ({ number, calledNumbers: cn, scores, nextTurn }) => {
    calledNumbers = cn;
    renderBoard();
    setStatus(`Number ${number} called. Scores: ${JSON.stringify(scores)}. ${nextTurn === socket.id ? 'YOUR TURN' : "Opponent's turn"}`);
  });

  socket.on('game:linesCompleted', ({ lines, newScore }) => {
    setStatus(`🎉 You completed ${lines.length} line(s)! Your score: ${newScore}`);
  });

  socket.on('game:over', ({ winnerId, scores }) => {
    setStatus(`🏆 GAME OVER — Winner: ${winnerId === socket.id ? 'YOU!' : 'Opponent'} | Scores: ${JSON.stringify(scores)}`);
  });

  socket.on('room:playerJoined', ({ name }) => appendChat(`* ${name} joined the room *`));
  socket.on('room:playerDisconnected', ({ playerId }) => appendChat(`* ${playerId} disconnected *`));
  socket.on('chat:message', (msg) => appendChat(`[${new Date(msg.timestamp).toLocaleTimeString()}] ${msg.userName}: ${msg.message}`));
}

function createRoom() {
  socket.emit('room:create', { isPrivate: true }, ({ roomId }) => {
    setStatus(`Room created: ${roomId} — share this code with your opponent`);
  });
}

function joinRoom() {
  const roomId = document.getElementById('roomCodeInput').value.trim().toUpperCase();
  socket.emit('room:join', { roomId }, (res) => {
    if (!res.success) setStatus('Error joining: ' + res.error);
  });
}

function quickMatch() {
  socket.emit('room:quickMatch', {}, (res) => {
    if (res.waiting) setStatus('Waiting for an opponent...');
  });
}

function renderBoard() {
  const boardEl = document.getElementById('board');
  boardEl.innerHTML = '';
  for (let r = 0; r < 5; r++) {
    for (let c = 0; c < 5; c++) {
      const num = myBoard[r][c];
      const div = document.createElement('div');
      div.className = 'cell' + (calledNumbers.includes(num) ? ' crossed' : '');
      div.textContent = num;
      div.onclick = () => makeMove(num);
      boardEl.appendChild(div);
    }
  }
}

function makeMove(number) {
  if (calledNumbers.includes(number)) return;
  socket.emit('game:move', { roomId: currentRoomId, number }, (res) => {
    if (!res.success) setStatus('Move error: ' + res.error);
  });
}

function sendChat() {
  const input = document.getElementById('chatInput');
  const message = input.value.trim();
  if (!message || !currentRoomId) return;
  socket.emit('chat:send', { roomId: currentRoomId, message }, () => {});
  input.value = '';
}

function appendChat(line) {
  const log = document.getElementById('chatLog');
  log.innerHTML += line + '<br/>';
  log.scrollTop = log.scrollHeight;
}

function setStatus(text) {
  document.getElementById('status').textContent = text;
}
</script>

</body>
</html>
